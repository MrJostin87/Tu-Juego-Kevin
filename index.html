<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Turbo 3D Mobile</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ui, #customization, #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 10;
            box-sizing: border-box;
            padding: 20px;
            overflow-y: auto;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.2rem;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 10px;
            text-align: center;
        }
        p {
            text-align: center;
            font-size: 1rem;
        }
        .btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }
        .car-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }
        .car-card {
            background: #222;
            border: 2px solid #444;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            width: 120px;
        }
        .car-card.selected {
            border-color: #ff3333;
            box-shadow: 0 0 10px #ff3333;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            pointer-events: none;
        }
        /* Controles táctiles en pantalla */
        #mobile-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 6;
            pointer-events: none;
        }
        .control-cluster {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255, 51, 51, 0.6);
            border-color: #ff3333;
        }
        .control-group {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
        }
        input[type="color"] {
            border: none;
            width: 50px;
            height: 35px;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="menu">
        <h1>SUPER TURBO 3D</h1>
        <p>Versión optimizada para celulares</p>
        <button class="btn" onclick="goToGarage()">Jugar / Personalizar</button>
    </div>

    <!-- TALLER / GARAGE (GRATIS) -->
    <div id="customization" class="hidden">
        <h1>TALLER (¡GRATIS!)</h1>
        <p>Elige tu vehículo:</p>
        <div class="car-grid" id="carGrid"></div>

        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; width: 100%; max-width: 320px; box-sizing: border-box;">
            <div class="control-group">
                <label>Carrocería:</label>
                <input type="color" id="bodyColorPicker" value="#ff0000" onchange="updateCarCustomization()">
            </div>
            <div class="control-group">
                <label>Rines:</label>
                <input type="color" id="wheelColorPicker" value="#333333" onchange="updateCarCustomization()">
            </div>
            <div class="control-group">
                <label>Fuego Escape:</label>
                <input type="color" id="fireColorPicker" value="#ff6600" onchange="updateCarCustomization()">
            </div>
        </div>

        <button class="btn" onclick="startGame()">¡A CORRER!</button>
    </div>

    <!-- HUD Y CONTROLES TÁCTILES -->
    <div id="hud" class="hidden">
        Velocidad: <span id="speedDisplay">0</span> km/h
    </div>

    <div id="mobile-controls" class="hidden">
        <div class="control-cluster">
            <button class="touch-btn" id="btnLeft">◀</button>
            <button class="touch-btn" id="btnRight">▶</button>
        </div>
        <div class="control-cluster">
            <button class="touch-btn" id="btnBrake">▼</button>
            <button class="touch-btn" id="btnGas" style="background: rgba(255,51,51,0.4);">▲</button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const carsData = [
            { id: 0, name: "Viper GT", type: "Sport", width: 1.6, length: 3.2, height: 0.9 },
            { id: 1, name: "Shadow X", type: "Muscle", width: 1.8, length: 3.5, height: 1.0 },
            { id: 2, name: "Cyber Stinger", type: "Futuro", width: 1.5, length: 3.0, height: 0.8 },
            { id: 3, name: "Thunderbolt", type: "Super", width: 1.7, length: 3.4, height: 0.85 },
            { id: 4, name: "Apex Phantom", type: "Hyper", width: 1.75, length: 3.6, height: 0.75 },
            { id: 5, name: "Blaze Runner", type: "Classic", width: 1.65, length: 3.3, height: 0.95 }
        ];

        let selectedCarIndex = 0;
        let customSettings = { bodyColor: "#ff0000", wheelColor: "#333333", fireColor: "#ff6600" };

        let scene, camera, renderer, playerCar, exhaustFireMesh;
        let keys = { forward: false, backward: false, left: false, right: false };
        let carSpeed = 0, maxSpeed = 0.8, acceleration = 0.015, deceleration = 0.01;
        let carAngle = 0;
        let gameActive = false;

        function initCarGrid() {
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '';
            carsData.forEach((car, index) => {
                const card = document.createElement('div');
                card.className = `car-card ${index === selectedCarIndex ? 'selected' : ''}`;
                card.innerHTML = `<h4 style="margin:5px 0;">${car.name}</h4><p style="margin:0; font-size:0.8rem;">${car.type}</p>`;
                card.onclick = () => {
                    selectedCarIndex = index;
                    document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                };
                grid.appendChild(card);
            });
        }

        function goToGarage() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('customization').classList.remove('hidden');
            initCarGrid();
        }

        function updateCarCustomization() {
            customSettings.bodyColor = document.getElementById('bodyColorPicker').value;
            customSettings.wheelColor = document.getElementById('wheelColorPicker').value;
            customSettings.fireColor = document.getElementById('fireColorPicker').value;
        }

        function startGame() {
            document.getElementById('customization').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('mobile-controls').classList.remove('hidden');
            initThreeJS();
            setupTouchControls();
            gameActive = true;
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createTrack();
            buildPlayerCar();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createTrack() {
            const floorGeo = new THREE.PlaneGeometry(1000, 1000);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const outerRoad = new THREE.Mesh(new THREE.RingGeometry(80, 140, 32), roadMat);
            outerRoad.rotation.x = -Math.PI / 2;
            scene.add(outerRoad);
        }

        function buildPlayerCar() {
            playerCar = new THREE.Group();
            const config = carsData[selectedCarIndex];

            const bodyGeo = new THREE.BoxGeometry(config.width, config.height, config.length);
            const bodyMat = new THREE.MeshStandardMaterial({ color: customSettings.bodyColor, metalness: 0.6, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = config.height / 2;
            playerCar.add(body);

            const cabinGeo = new THREE.BoxGeometry(config.width * 0.7, config.height * 0.7, config.length * 0.5);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, config.height + (config.height * 0.35) / 2, -0.1);
            playerCar.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: customSettings.wheelColor });
            const wheelPositions = [
                [-config.width/2 - 0.1, 0.35, config.length/3],
                [config.width/2 + 0.1, 0.35, config.length/3],
                [-config.width/2 - 0.1, 0.35, -config.length/3],
                [config.width/2 + 0.1, 0.35, -config.length/3]
            ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                playerCar.add(wheel);
            });

            const fireGeo = new THREE.ConeGeometry(0.2, 0.8, 8);
            fireGeo.rotateX(Math.PI / 2);
            const fireMat = new THREE.MeshBasicMaterial({ color: customSettings.fireColor, transparent: true, opacity: 0 });
            exhaustFireMesh = new THREE.Mesh(fireGeo, fireMat);
            exhaustFireMesh.position.set(0.3, 0.4, -config.length/2 - 0.4);
            playerCar.add(exhaustFireMesh);

            playerCar.position.set(0, 0, 110);
            scene.add(playerCar);
        }

        function setupTouchControls() {
            const bindButton = (id, keyName) => {
                const btn = document.getElementById(id);
                const press = (e) => { e.preventDefault(); keys[keyName] = true; };
                const release = (e) => { e.preventDefault(); keys[keyName] = false; };

                btn.addEventListener('touchstart', press, {passive: false});
                btn.addEventListener('touchend', release, {passive: false});
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
            };

            bindButton('btnLeft', 'left');
            bindButton('btnRight', 'right');
            bindButton('btnGas', 'forward');
            bindButton('btnBrake', 'backward');
        }

        function updateGame() {
            if (!gameActive) return;

            if (keys.forward) {
                carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
                exhaustFireMesh.material.opacity = 0.9 + Math.random() * 0.1;
                exhaustFireMesh.scale.set(1 + Math.random()*0.5, 1 + Math.random()*0.5, 1 + Math.random()*1.5);
            } else if (keys.backward) {
                carSpeed = Math.max(carSpeed - acceleration, -maxSpeed / 2);
                exhaustFireMesh.material.opacity = 0;
            } else {
                if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - deceleration);
                if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + deceleration);
                exhaustFireMesh.material.opacity = 0;
            }

            if (Math.abs(carSpeed) > 0.01) {
                let turnRate = 0.03 * (carSpeed / maxSpeed);
                if (keys.left) carAngle += turnRate;
                if (keys.right) carAngle -= turnRate;
            }

            playerCar.rotation.y = carAngle;
            playerCar.position.x += Math.sin(carAngle) * carSpeed * 15;
            playerCar.position.z += Math.cos(carAngle) * carSpeed * 15;

            document.getElementById('speedDisplay').innerText = Math.floor(Math.abs(carSpeed) * 200);

            const cameraOffset = new THREE.Vector3(-Math.sin(carAngle) * 8, 4, -Math.cos(carAngle) * 8);
            camera.position.copy(playerCar.position).add(cameraOffset);
            camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1, 0)));
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        window.onload = () => { initCarGrid(); };
    </script>
</body>
</html>

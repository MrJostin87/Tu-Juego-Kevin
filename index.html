<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Turbo 3D Racing</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui, #customization, #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 3rem;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 20px;
        }
        .btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transition: 0.2s;
        }
        .btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        .car-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        .car-card {
            background: #222;
            border: 2px solid #444;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            width: 150px;
            transition: 0.2s;
        }
        .car-card:hover, .car-card.selected {
            border-color: #ff3333;
            box-shadow: 0 0 15px #ff3333;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            pointer-events: none;
        }
        .control-group {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        label {
            font-size: 1.1rem;
        }
        input[type="color"] {
            border: none;
            width: 50px;
            height: 30px;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>SUPER TURBO 3D</h1>
        <p>¡Elige tu auto, modifícalo gratis y compite!</p>
        <button class="btn" onclick="goToGarage()">Jugar / Modificar Autos</button>
    </div>

    <div id="customization" class="hidden">
        <h1>TALLER DE MODIFICACIÓN (¡GRATIS!)</h1>
        <p>Selecciona tu vehículo:</p>
        <div class="car-grid" id="carGrid"></div>

        <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; text-align: left;">
            <div class="control-group">
                <label>Color de Carrocería:</label>
                <input type="color" id="bodyColorPicker" value="#ff0000" onchange="updateCarCustomization()">
            </div>
            <div class="control-group">
                <label>Color de Rines:</label>
                <input type="color" id="wheelColorPicker" value="#333333" onchange="updateCarCustomization()">
            </div>
            <div class="control-group">
                <label>Color del Fuego de Escape:</label>
                <input type="color" id="fireColorPicker" value="#ff6600" onchange="updateCarCustomization()">
            </div>
        </div>

        <button class="btn" onclick="startGame()" style="margin-top: 20px;">¡A LA PISTA!</button>
    </div>

    <div id="hud" class="hidden">
        Velocidad: <span id="speedDisplay">0</span> km/h<br>
        <span style="font-size: 0.9rem; color: #aaa;">Usa W/A/S/D o Flechas para conducir</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Datos de los muchísimos autos disponibles (simulados en catálogo)
        const carsData = [
            { id: 0, name: "Viper GT", type: "Sport", width: 1.6, length: 3.2, height: 0.9 },
            { id: 1, name: "Shadow X", type: "Muscle", width: 1.8, length: 3.5, height: 1.0 },
            { id: 2, name: "Cyber Stinger", type: "Futurista", width: 1.5, length: 3.0, height: 0.8 },
            { id: 3, name: "Thunderbolt", type: "Supercar", width: 1.7, length: 3.4, height: 0.85 },
            { id: 4, name: "Apex Phantom", type: "Hypercar", width: 1.75, length: 3.6, height: 0.75 },
            { id: 5, name: "Blaze Runner", type: "Classic", width: 1.65, length: 3.3, height: 0.95 }
        ];

        let selectedCarIndex = 0;
        let customSettings = {
            bodyColor: "#ff0000",
            wheelColor: "#333333",
            fireColor: "#ff6600"
        };

        // Variables de Three.js y del juego
        let scene, camera, renderer, playerCar;
        let trackMesh, exhaustFireMesh;
        let keys = { forward: false, backward: false, left: false, right: false };
        let carSpeed = 0, maxSpeed = 0.8, acceleration = 0.015, deceleration = 0.01;
        let carAngle = 0;
        let gameActive = false;

        // Inicializar selector de autos en el menú
        function initCarGrid() {
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '';
            carsData.forEach((car, index) => {
                const card = document.createElement('div');
                card.className = `car-card ${index === selectedCarIndex ? 'selected' : ''}`;
                card.innerHTML = `<h3>${car.name}</h3><p>${car.type}</p>`;
                card.onclick = () => {
                    selectedCarIndex = index;
                    document.querySelectorAll('.car-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                };
                grid.appendChild(card);
            });
        }

        function goToGarage() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('customization').classList.remove('hidden');
            initCarGrid();
        }

        function updateCarCustomization() {
            customSettings.bodyColor = document.getElementById('bodyColorPicker').value;
            customSettings.wheelColor = document.getElementById('wheelColorPicker').value;
            customSettings.fireColor = document.getElementById('fireColorPicker').value;
        }

        function startGame() {
            document.getElementById('customization').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            initThreeJS();
            gameActive = true;
        }

        function initThreeJS() {
            // Escena y cámara
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Cielo azul claro
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Crear Pista de Carreras
            createTrack();

            // Construir Auto del Jugador
            buildPlayerCar();

            // Eventos de teclado
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createTrack() {
            // Césped del entorno
            const floorGeo = new THREE.PlaneGeometry(1000, 1000);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Pista ovalada simulada con una forma rectangular hueca gigante / o un camino circular
            const trackGroup = new THREE.Group();
            
            // Pavimento de la pista principal
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            
            // Recta principal y curvas (diseño de circuito simple tipo óvalo grande)
            const roadShape = new THREE.Shape();
            // Creamos un circuito con curvas
            const outerRoad = new THREE.Mesh(new THREE.RingGeometry(80, 140, 32), roadMat);
            outerRoad.rotation.x = -Math.PI / 2;
            outerRoad.receiveShadow = true;
            trackGroup.add(outerRoad);

            // Líneas decorativas y barreras sencillas
            scene.add(trackGroup);
        }

        function buildPlayerCar() {
            playerCar = new THREE.Group();
            const config = carsData[selectedCarIndex];

            // Carrocería principal
            const bodyGeo = new THREE.BoxGeometry(config.width, config.height, config.length);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: customSettings.bodyColor, 
                metalness: 0.6, 
                roughness: 0.4 
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = config.height / 2;
            body.castShadow = true;
            playerCar.add(body);

            // Cabina / Vidrios
            const cabinGeo = new THREE.BoxGeometry(config.width * 0.7, config.height * 0.7, config.length * 0.5);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, config.height + (config.height * 0.35) / 2, -0.1);
            playerCar.add(cabin);

            // Ruedas
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: customSettings.wheelColor });
            
            const wheelPositions = [
                [-config.width/2 - 0.1, 0.35, config.length/3],
                [config.width/2 + 0.1, 0.35, config.length/3],
                [-config.width/2 - 0.1, 0.35, -config.length/3],
                [config.width/2 + 0.1, 0.35, -config.length/3]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                playerCar.add(wheel);
            });

            // Fuego del tubo de escape (dinámico)
            const fireGeo = new THREE.ConeGeometry(0.2, 0.8, 8);
            fireGeo.rotateX(Math.PI / 2);
            const fireMat = new THREE.MeshBasicMaterial({ color: customSettings.fireColor, transparent: true, opacity: 0 });
            exhaustFireMesh = new THREE.Mesh(fireGeo, fireMat);
            exhaustFireMesh.position.set(0.3, 0.4, -config.length/2 - 0.4);
            playerCar.add(exhaustFireMesh);

            // Posición inicial en la pista
            playerCar.position.set(0, 0, 110);
            scene.add(playerCar);
        }

        function handleKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w':
                case 'arrowup':
                    keys.forward = isDown;
                    break;
                case 's':
                case 'arrowdown':
                    keys.backward = isDown;
                    break;
                case 'a':
                case 'arrowleft':
                    keys.left = isDown;
                    break;
                case 'd':
                case 'arrowright':
                    keys.right = isDown;
                    break;
            }
        }

        function updateGame() {
            if (!gameActive) return;

            // Aceleración y Frenado
            if (keys.forward) {
                carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
                exhaustFireMesh.material.opacity = 0.9 + Math.random() * 0.1; // Encender fuego
                exhaustFireMesh.scale.set(1 + Math.random()*0.5, 1 + Math.random()*0.5, 1 + Math.random()*1.5);
            } else if (keys.backward) {
                carSpeed = Math.max(carSpeed - acceleration, -maxSpeed / 2);
                exhaustFireMesh.material.opacity = 0;
            } else {
                if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - deceleration);
                if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + deceleration);
                exhaustFireMesh.material.opacity = 0; // Apagar fuego al soltar acelerador
            }

            // Giros (solo si el auto se está moviendo)
            if (Math.abs(carSpeed) > 0.01) {
                let turnRate = 0.03 * (carSpeed / maxSpeed);
                if (keys.left) carAngle += turnRate;
                if (keys.right) carAngle -= turnRate;
            }

            // Aplicar movimiento al auto
            playerCar.rotation.y = carAngle;
            playerCar.position.x += Math.sin(carAngle) * carSpeed * 15;
            playerCar.position.z += Math.cos(carAngle) * carSpeed * 15;

            // Actualizar HUD de velocidad
            document.getElementById('speedDisplay').innerText = Math.floor(Math.abs(carSpeed) * 200);

            // Cámara en tercera persona siguiendo al auto
            const cameraOffset = new THREE.Vector3(
                -Math.sin(carAngle) * 8,
                4,
                -Math.cos(carAngle) * 8
            );
            camera.position.copy(playerCar.position).add(cameraOffset);
            camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1, 0)));
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Inicializar grilla del menú al cargar
        window.onload = () => {
            initCarGrid();
        };
    </script>
</body>
</html>
